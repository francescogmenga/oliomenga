<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olive Oil Shop</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        .product { display: inline-block; margin: 20px; padding: 20px; border: 1px solid #ccc; }
        .cart { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Premium Olive Oil</h1>
    <div class="product">
        <img src="olive-oil.jpg" alt="Olive Oil" width="150">
        <h2>Extra Virgin Olive Oil</h2>
        <p>Price: $15</p>
        <button onclick="addToCart('Extra Virgin Olive Oil', 15)">Add to Cart</button>
    </div>
    
    <div class="cart">
        <h2>Shopping Cart</h2>
        <ul id="cart-items"></ul>
        <p>Total: $<span id="total-price">0</span></p>
        <button onclick="checkout()">Checkout</button>
    </div>
    
    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        updateCartDisplay();
        
        function addToCart(name, price) {
            cart.push({ name, price });
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartDisplay();
        }
        
        function updateCartDisplay() {
            const cartList = document.getElementById("cart-items");
            const totalPrice = document.getElementById("total-price");
            cartList.innerHTML = "";
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                const li = document.createElement("li");
                li.textContent = `${item.name} - $${item.price}`;
                cartList.appendChild(li);
            });
            totalPrice.textContent = total;
        }
        
        function checkout() {
            alert("Checkout functionality is not implemented");
        }
    </script>
</body>
</html>
