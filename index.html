<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olive Oil Shop</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f8f8f8; }
        .container { max-width: 800px; margin: auto; padding: 20px; }
        .product { display: inline-block; margin: 20px; padding: 20px; border: 1px solid #ccc; background: white; border-radius: 10px; }
        .cart { margin-top: 20px; padding: 20px; background: white; border-radius: 10px; }
        button { background: green; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 5px; }
        button:hover { background: darkgreen; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Premium Olive Oil Selection</h1>
        
        <div class="product">
            <img src="olive-oil.jpg" alt="Olive Oil" width="150">
            <h2>Blend (5L)</h2>
            <p>Price: €65</p>
            <button onclick="addToCart('Blend (5L)', 65)">Add to Cart</button>
        </div>
        
        <div class="product">
            <img src="olive-oil.jpg" alt="Olive Oil" width="150">
            <h2>Blend (0.75L)</h2>
            <p>Price: €15</p>
            <button onclick="addToCart('Blend (0.75L)', 15)">Add to Cart</button>
        </div>
        
        <div class="product">
            <img src="olive-oil.jpg" alt="Olive Oil" width="150">
            <h2>Bicultivar (0.75L)</h2>
            <p>Price: €17</p>
            <button onclick="addToCart('Bicultivar (0.75L)', 17)">Add to Cart</button>
        </div>
        
        <div class="product">
            <img src="olive-oil.jpg" alt="Olive Oil" width="150">
            <h2>Monocultivar Verde (0.75L)</h2>
            <p>Price: €20</p>
            <button onclick="addToCart('Monocultivar Verde (0.75L)', 20)">Add to Cart</button>
        </div>
        
        <div class="product">
            <img src="olive-oil.jpg" alt="Olive Oil" width="150">
            <h2>Monocultivar Rosso (0.75L)</h2>
            <p>Price: €20</p>
            <button onclick="addToCart('Monocultivar Rosso (0.75L)', 20)">Add to Cart</button>
        </div>
        
        <div class="cart">
            <h2>Shopping Cart</h2>
            <ul id="cart-items"></ul>
            <p>Total: €<span id="total-price">0</span></p>
            <button onclick="checkout()">Checkout</button>
        </div>
    </div>
    
    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        updateCartDisplay();
        
        function addToCart(name, price) {
            cart.push({ name, price });
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartDisplay();
        }
        
        function updateCartDisplay() {
            const cartList = document.getElementById("cart-items");
            const totalPrice = document.getElementById("total-price");
            cartList.innerHTML = "";
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                const li = document.createElement("li");
                li.innerHTML = `${item.name} - €${item.price} <button onclick="removeFromCart(${index})">Remove</button>`;
                cartList.appendChild(li);
            });
            totalPrice.textContent = total;
        }
        
        function removeFromCart(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartDisplay();
        }
        
        function checkout() {
            alert("Checkout functionality is not implemented");
        }
    </script>
</body>
</html>
